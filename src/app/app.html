<router-outlet></router-outlet>
<nav class="account-shortcuts" aria-label="Acceso a cuenta">
  @if (auth.user(); as user) {
    <a routerLink="/cuenta" aria-label="Abrir mi perfil"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Mi cuenta</span></a>
    @if (user.role === 'admin') {
      <a routerLink="/metricas" aria-label="Abrir métricas"><i class="fa-solid fa-chart-line" aria-hidden="true"></i><span>Métricas</span></a>
    }
    <button type="button" aria-label="Cerrar sesión" title="Cerrar sesión" (click)="signOut()"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i></button>
  } @else {
    <a routerLink="/cuenta"><i class="fa-solid fa-user" aria-hidden="true"></i><span>Ingresar</span></a>
  }
</nav>
@if (showCart()) {
  <app-cart-widget></app-cart-widget>
}
