services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: sqlite:////data/unialre.db
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
      FRONTEND_ORIGINS: https://${DOMAIN:?Set a real DOMAIN in .env}
    secrets:
      - jwt_secret
    volumes:
      - database:/data
      - uploads:/app/uploads
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    init: true
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    environment:
      DOMAIN: ${DOMAIN:?Set a real DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    security_opt:
      - no-new-privileges:true

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret

volumes:
  database:
  uploads:
  caddy_data:
  caddy_config:
